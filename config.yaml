# Gait Edge Identification - Configuration
# See docs/ARCHITECTURE.md for why these values are what they are.

# ==============================================================================
# Model
# ==============================================================================
model:
  # GaitGraph2 (ResGCN-N51-R4) pretrained on OUMVLP-Pose, used as-is. Not in
  # git - the weights have no license. Create with:
  #   python scripts/convert_gaitgraph2.py path/to/model_weights.zip
  checkpoint_path: "models/checkpoint/gaitgraph2_oumvlp.pth"
  # Mean embedding of the 13-subject research videos, subtracted before
  # cosine (docs/ARCHITECTURE.md #4). Regenerate with
  # scripts/eval_research_videos.py --write-center.
  center_path: "models/checkpoint/gaitgraph2_center.npy"
  device: "auto"                     # "cuda", "cpu", or "auto"

# ==============================================================================
# Identification
# ==============================================================================
# Each walk becomes one embedding; it's compared (centered cosine) against
# every enrolled person's signature and the best match above threshold wins.
identification:
  # Centered-cosine cutoff: the stranger-vs-enrolled EER point for front-view
  # walks (toward the camera) with 2 people enrolled, from
  # scripts/eval_research_videos.py. A new camera shifts it - watch the scores
  # identify.py prints: raise it if strangers get accepted, lower it if
  # enrolled people come up UNKNOWN.
  similarity_threshold: 0.75

  top_k_candidates: 3               # how many candidates to report for diagnostics

# ==============================================================================
# Database
# ==============================================================================
database:
  path: "database/gait.db"
  auto_init: true

# ==============================================================================
# Camera
# ==============================================================================
camera:
  # 0 = first USB/V4L2 webcam (/dev/video0). For the Jetson's MIPI CSI camera
  # replace it with this GStreamer pipeline string (keep it on ONE line):
  # device_id: "nvarguscamerasrc ! video/x-raw(memory:NVMM), width=1280, height=720, framerate=30/1 ! nvvidconv ! video/x-raw, width=640, height=480, format=BGRx ! videoconvert ! video/x-raw, format=BGR ! appsink drop=1"
  device_id: 0
  fps_target: 30
  resolution: [640, 480]
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

# ==============================================================================
# Pose extraction
# ==============================================================================
pose:
  num_landmarks: 12                  # gait-relevant subset of MediaPipe's 33
  frame_skip: 1                      # 1 = process every frame

# ==============================================================================
# Sequence assembly
# ==============================================================================
sequence:
  # Real pose frames collected per captured walk (about 2-3 s). The model
  # needs at least 1.2 s after resampling to 25 fps; more walking = more
  # 30-frame windows averaged into one embedding.
  min_valid_frames: 60

# ==============================================================================
# Enrollment
# ==============================================================================
enrollment:
  min_sequences: 3                   # walk passes required to enroll someone
  max_sequences: 5
  quality_threshold: 0.80            # min fraction of frames with a valid pose detection

# ==============================================================================
# Logging
# ==============================================================================
logging:
  level: "INFO"
  file: "outputs/logs/gait_identification.log"
  console: true
  max_size_mb: 100
  backup_count: 5

# ==============================================================================
# Events (for downstream RPA)
# ==============================================================================
events:
  output_dir: "outputs/events"
  save_to_file: true
  # webhook_url: "http://localhost:8000/events"

# ==============================================================================
# Development
# ==============================================================================
development:
  debug: false
  visualize_poses: false
